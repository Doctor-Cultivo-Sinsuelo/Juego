<html lang="es"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

<title>Posada: Tablero de Navidad</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:system-ui,sans-serif;background:#12301f;color:#fff}
#app{max-width:900px;margin:auto;padding:10px}
h1{font-size:22px;text-align:center;margin:8px 0}
.card{background:#1e4a30;border-radius:14px;padding:12px;margin:8px 0}
button{font:inherit;border:0;border-radius:12px;padding:12px 14px;background:#c8102e;color:#fff;font-weight:700;margin:3px}
button.g{background:#2e7d32}button.y{background:#f5b800;color:#222}button.s{background:#555}
button:disabled{opacity:.35}
input{font:inherit;padding:12px;border-radius:10px;border:0;width:130px;text-transform:uppercase;text-align:center}
.row{display:flex;flex-wrap:wrap;gap:4px;justify-content:center;align-items:center}
.av{font-size:32px;background:#fff3;border-radius:12px;padding:6px 10px}.av.on{background:#f5b800}
#wrap{overflow:auto;border-radius:12px;border:3px solid #fff}
#board{position:relative;width:100%;min-width:100%}
#board img{display:block;width:100%}
.tk{position:absolute;width:6.4%;aspect-ratio:1;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:clamp(14px,3.6vw,30px);border:3px solid;background:#fffd;transform:translate(-50%,-50%);transition:left .8s,top .8s;z-index:2}
.big{font-size:20px;font-weight:800;text-align:center}
#dado{font-size:90px;text-align:center;line-height:1}
.badge{display:inline-block;border-radius:8px;padding:2px 8px;font-weight:800;color:#222}
.ans{background:#f5b800;color:#222;border-radius:10px;padding:8px;margin:6px 0;font-weight:700}
small{opacity:.8}
</style></head><body>

  ["Un tren mágico lleva a un niño al Polo Norte. ¿Cuál película?","El expreso polar"],
  ["Un humano criado por elfos viaja a Nueva York. ¿Cuál película?","Elf"],
  ["Jack Skeleton quiere hacerse cargo de la Navidad. ¿Cuál película?","Pesadilla antes de Navidad"],
  ["Tres fantasmas visitan a un hombre avaro. ¿Cuál película?","Cuento de Navidad"]],
 "💬 Frases":[
  ["Completa: Feliz Navidad y próspero ___","Año Nuevo"],
  ["Completa la risa de Santa: Jo, jo, ___","Jo"],
  ["¿A quién se le atribuye decir ¡Bah, paparruchas!?","Scrooge"],
  ["Completa: Noche de ___, noche de amor","Paz"],
  ["Di tres cosas que no pueden faltar en tu cena de Navidad.","Reto abierto"],
  ["Imita la risa de Santa Claus en voz alta.","Reto de actuación"]]
};
const CATS=Object.keys(RETOS);

/* ===== ALMACÉN: Firebase REST o localStorage (demo) ===== */
const CID=localStorage.cid||(localStorage.cid=Math.random().toString(36).slice(2));
let room=null,role=null,myTeam=null,S=null,sig="",rolling=false,zoom=false;
async function load(){
  try{ if(DB_URL){const r=await fetch(`${DB_URL}/salas/${room}.json`);return await r.json();}
  return JSON.parse(localStorage.getItem("sala_"+room)||"null");}catch(e){return S}
}
async function upd(o){
  if(DB_URL){await fetch(`${DB_URL}/salas/${room}.json`,{method:"PATCH",body:JSON.stringify(o)});}
  else{const d=JSON.parse(localStorage.getItem("sala_"+room)||"{}");
    for(const k in o){const ps=k.split("/");let n=d;for(let i=0;i<ps.length-1;i++)n=n[ps[i]]=n[ps[i]]||{};
      if(o[k]===null)delete n[ps.at(-1)];else n[ps.at(-1)]=o[k];}
    localStorage.setItem("sala_"+room,JSON.stringify(d));}
  S=await load();draw(true);
}
async function poll(){ if(!room)return; const d=await load(); const s=JSON.stringify(d); if(s!==sig){S=d;draw();} setTimeout(poll,DB_URL?1200:500); }

/* ===== PANTALLAS ===== */
const app=document.getElementById("app");
const eq=()=>{const q=(S&&S.equipos)||{},o={};Object.keys(q).forEach(k=>{if(q[k])o[k]=q[k]});return o};
const teams=()=>Object.keys(eq()).map(Number).sort();
function home(){
  const q=new URLSearchParams(location.search).get("sala")||"";
  app.innerHTML=`<h1>🎄 Posada: Tablero de Navidad 🎄</h1>
  <div class="card row"><div class="big" style="width:100%">Entrar a una sala</div>
   <input id="cod" maxlength="4" placeholder="CÓDIGO" value="${q}"><button class="g" onclick="join()">Unirme como equipo</button></div>
  <div class="card row"><div class="big" style="width:100%">¿Eres el juez?</div><button class="y" onclick="crear()">Crear sala nueva</button></div>
  ${DB_URL?"":"<small>Modo demo: falta pegar la databaseURL de Firebase en index.html para jugar entre celulares.</small>"}`;
}
async function crear(){
  room=Array.from({length:4},()=>"ABCDEFGHJKLMNPQRSTUVWXYZ"[Math.random()*24|0]).join("");
  role="juez"; await upd({estado:{turno:0,puedeTirar:false,reto:null,dado:null,ganador:null}});
  poll();
}
async function join(){
  const c=document.getElementById("cod").value.trim().toUpperCase(); if(c.length!==4)return alert("Escribe el código de 4 letras");
  room=c; S=await load(); if(!S||!S.estado){room=null;return alert("No encuentro esa sala");}
  role="equipo"; poll(); draw(true);
}
async function elegir(n,av){
  const e=eq()[n]; if(e&&e.id!==CID)return alert("Ese equipo ya está ocupado");
  const mine=Object.entries(eq()).find(([k,v])=>v.id===CID);
  const o={}; if(mine&&+mine[0]!==n)o["equipos/"+mine[0]]=null;
  o["equipos/"+n]={av,pos:e?e.pos:0,id:CID}; if(!S.estado.turno)o["estado/turno"]=n;
  myTeam=n; await upd(o);
}
function pickScreen(){
  const mine=Object.entries(eq()).find(([k,v])=>v.id===CID); const my=mine?mine[1]:null; if(mine)myTeam=+mine[0];
  const t=myTeam||0, av=my?my.av:"";
  return `<div class="card"><div class="big">Elige tu equipo y avatar</div><div class="row">
   ${[1,2,3,4].map(n=>`<button style="background:${COLORS[n]};color:${n==4?"#222":"#fff"}" ${t==n?'class="sel"':""} onclick="setT(${n})">Equipo ${n}${eq()[n]&&eq()[n].id!==CID?" ✖":""}</button>`).join("")}</div>
   <div class="row">${AVATARS.map(a=>`<span class="av ${a===av?"on":""}" onclick="setA('${a}')">${a}</span>`).join("")}</div></div>`;
}
let pt=0;
function setT(n){pt=n;const e=eq()[n]; elegir(n,e&&e.id===CID?e.av:(window.pa||AVATARS[n-1]));}
function setA(a){window.pa=a; const n=myTeam||pt||1; elegir(n,a);}

function boardHTML(){
  const tk=teams().map((n,i)=>{const e=eq()[n],[x,y]=cell(n,e.pos||0);
    return `<div class="tk" style="left:${x+(i%2?1.2:-1.2)}%;top:${y}%;border-color:${COLORS[n]}">${e.av}</div>`}).join("");
  return `<div id="wrap"><div id="board" style="width:${zoom?220:100}%"><img src="data:image/webp;base64,${BOARD}" alt="Tablero">${tk}</div></div>
  <div class="row"><button class="s" onclick="zoom=!zoom;draw(true)">🔍 ${zoom?"Ver completo":"Acercar"}</button></div>`;
}
function standings(){
  return `<div class="row">${teams().map(n=>{const e=eq()[n];return `<span class="badge" style="background:${COLORS[n]}">${e.av} E${n}: casilla ${e.pos}/${LAST}</span>`}).join("")}</div>`;
}
function retoHTML(juez){
  const r=S.estado.reto; if(!r)return `<div class="big">Esperando reto…</div>`;
  const [q,a]=RETOS[CATS[r.c]][r.i];
  return `<div class="card"><small>${CATS[r.c]}</small><div class="big">${q}</div>${juez?`<div class="ans">Respuesta: ${a}</div>`:""}</div>`;
}
function dadoHTML(){
  const d=S.estado.dado; const f=d?FACES[d.n-1]:"🎲";
  return `<div id="dado">${f}</div>`;
}
function turnoBanner(){ const t=S.estado.turno; return t?`<div class="big" style="color:${COLORS[t]==="#fdd835"?"#fdd835":"#fff"}">Turno del Equipo ${t} ${eq()[t]?eq()[t].av:""}</div>`:`<div class="big">Esperando equipos…</div>`; }

async function tirar(){
  if(rolling)return; rolling=true; const el=document.getElementById("dado");
  let k=0; const iv=setInterval(()=>{el.textContent=FACES[Math.random()*6|0];if(++k>10){clearInterval(iv);fin()}},70);
  async function fin(){
    const n=1+(Math.random()*6|0), t=S.estado.turno, e=eq()[t];
    let p=Math.min(LAST,(e.pos||0)+n); const p2=applyEffect(t,p);
    const o={["equipos/"+t+"/pos"]:p2,"estado/puedeTirar":false,"estado/dado":{n,t:Date.now(),eq:t,efecto:p2-p}};
    if(p2>=LAST)o["estado/ganador"]=t;
    rolling=false; await upd(o);
  }
}
function nextTurn(){const ts=teams();if(!ts.length)return;const t=S.estado.turno;const n=ts.find(x=>x>t)||ts[0];
  upd({"estado/turno":n,"estado/reto":null,"estado/puedeTirar":false});}
function pedir(c){upd({"estado/reto":{c,i:Math.random()*RETOS[CATS[c]].length|0},"estado/puedeTirar":false});}
function ajustar(n,d){const e=eq()[n];upd({["equipos/"+n+"/pos"]:Math.max(0,Math.min(LAST,e.pos+d))});}

function draw(force){
  const s=JSON.stringify(S); if(!force&&s===sig)return; sig=s;
  if(!room){home();return;}
  const keep=document.getElementById("wrap"); const sx=keep?keep.scrollLeft:0, sy=keep?keep.scrollTop:0;
  if(!S||!S.estado){app.innerHTML="Cargando…";return;}
  const E=S.estado; let h="";
  if(role==="juez"){
    const link=location.origin&&location.origin!=="null"?`${location.origin}${location.pathname}?sala=${room}`:"";
    h=`<h1>👨‍⚖️ Juez · Sala <span style="letter-spacing:3px">${room}</span></h1>
    <div class="card"><div class="row"><small>Equipos entran con el código o escaneando:</small></div>
    <div class="row"><div id="qr" style="background:#fff;padding:6px;border-radius:8px;min-width:96px;min-height:96px"></div></div><small style="word-break:break-all">${link}</small></div>
    ${E.ganador?`<div class="card big">🏆 ¡Ganó el Equipo ${E.ganador}! <button class="y" onclick="upd({'estado/ganador':null,'estado/reto':null,'estado/puedeTirar':false,'equipos':Object.fromEntries(teams().map(n=>[n,{...eq()[n],pos:0}]))})">Reiniciar</button></div>`:""}
    ${turnoBanner()}
    <div class="card"><div class="row">${CATS.map((c,i)=>`<button onclick="pedir(${i})">${c}</button>`).join("")}</div>${retoHTML(true)}
     <div class="row"><button class="g" ${E.reto&&!E.puedeTirar&&E.turno?"":"disabled"} onclick="upd({'estado/puedeTirar':true})">✅ Acertó (puede tirar)</button>
     <button class="s" onclick="nextTurn()">❌ Falló / Siguiente</button></div></div>
    ${dadoHTML()}${E.dado&&E.dado.efecto?`<div class="big">${E.dado.efecto>0?"¡Avanza "+E.dado.efecto+" extra!":"¡Regresa "+(-E.dado.efecto)+"!"}</div>`:""}
    ${boardHTML()}${standings()}
    <div class="card"><small>Corrección manual</small><div class="row">${teams().map(n=>`<span class="badge" style="background:${COLORS[n]}">E${n}</span><button class="s" onclick="ajustar(${n},-1)">−1</button><button class="s" onclick="ajustar(${n},1)">+1</button>`).join("")}</div></div>`;
  } else {
    const mine=Object.entries(eq()).find(([k,v])=>v.id===CID);
    h=`<h1>🎄 Sala ${room}</h1>`;
    if(!mine){h+=pickScreen();}
    else{
      const n=+mine[0],me=mine[1],mi=E.turno===n;
      h+=`<div class="row"><span class="badge" style="background:${COLORS[n]};font-size:18px">${me.av} Equipo ${n} · casilla ${me.pos}/${LAST}</span></div>
      ${E.ganador?`<div class="card big">🏆 ¡Ganó el Equipo ${E.ganador}!</div>`:""}
      ${turnoBanner()}${retoHTML(false)}
      <div class="row"><button class="y" style="font-size:20px;padding:16px 28px" ${mi&&E.puedeTirar&&!E.ganador?"":"disabled"} onclick="tirar()">🎲 Tirar dado</button></div>
      ${dadoHTML()}${E.dado&&E.dado.efecto?`<div class="big">${E.dado.efecto>0?"¡Avanza "+E.dado.efecto+" extra!":"¡Regresa "+(-E.dado.efecto)+"!"}</div>`:""}
      ${boardHTML()}${standings()}
      <details class="card"><summary>Cambiar avatar</summary>${pickScreen()}</details>`;
    }
  }
  app.innerHTML=h;
  const w=document.getElementById("wrap"); if(w){w.scrollLeft=sx;w.scrollTop=sy;}
  if(role==="juez")qr();
}
function qr(){
  const box=document.getElementById("qr"),link=`${location.origin}${location.pathname}?sala=${room}`; if(!box||location.origin==="null")return;
  const mk=()=>{box.innerHTML="";new QRCode(box,{text:link,width:96,height:96});};
  if(window.QRCode)return mk();
  const s=document.createElement("script");s.src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js";s.onload=mk;document.head.appendChild(s);
}
home();
</script></body></html>
